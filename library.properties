sentence=Arduino library for the Texas Instruments TMAG5273 3D Hall-effect sensor.
paragraph=Reads the magnetic field of the X, Y and Z axes, the die temperature and the calculated angle of the TMAG5273 over I2C, with CRC protected reads, thresholds, interrupts, gain/offset correction, plus encoder and proximity application layers. Supports the TMAG5273x1 (+/-40 mT and +/-80 mT) and TMAG5273x2 (+/-133 mT and +/-266 mT) sensitivity options.
